# What `make check` runs, on every push and pull request.
#
# This is deliberately not Phase 3c. That item is a real *browser* in CI and it is still the
# trailing one; this job is typecheck, lint and the suite — no browser, no model, no tokens.
# "No CI" had been in the README's known-gaps list for weeks while `make check` sat there
# defining exactly what a CI job would run, because the trailing-item rule was read as
# covering both. It never did.
#
# The containers are the real ones from docker-compose.yml rather than GitHub `services:`,
# for one reason that matters: `tools/prepare-test-dbs.sh` creates the four test databases
# with `docker compose exec -T postgres psql`, and this machine is the same shape as a
# developer's. A second, CI-only path to the test databases would be a second thing to keep
# correct, and the one that broke would be the one nobody runs by hand.

name: check

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you about a commit nobody is waiting for.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Compose interpolates the whole file before it starts anything, so the egress proxy's
      # `${VAR:?}` variables have to be set even though this job never starts that service.
      # Placeholders on purpose: nothing here reaches a model API, and a real key in CI
      # would be a credential in a log-visible environment for no benefit.
      LOOM_EGRESS_CONTROL_SECRET: ci-placeholder-the-proxy-does-not-run-here
      ANTHROPIC_API_KEY: ci-placeholder-no-model-call-happens-in-this-job

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # 22 is the declared floor in `engines`, and development happens on 24. Running the
      # floor is the point: a claim in package.json that nothing tests is a claim.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--wait` honours the healthchecks already in the compose file, so the next step
      # cannot race a database that is listening but not ready.
      - name: Start Postgres and Valkey
        run: docker compose up -d --wait postgres valkey

      - name: Create and migrate the test databases
        run: pnpm db:test:prepare

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Both are outside `turbo run test` on purpose and are part of `make check`'s
      # intent: the architecture test asserts the dependency rule holds, and the tools
      # typecheck covers a directory turbo never sees — where a driver rotted for months.
      - name: Layer boundaries
        run: npx vitest run tools/architecture.test.ts

      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail 50 postgres valkey
