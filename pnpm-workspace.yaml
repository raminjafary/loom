packages:
 - "apps/*"
 - "packages/*"
allowBuilds:
 esbuild: true
# Dependabot triage — 16 advisories (8 high) down to 1. Every entry is the smallest bump
# that clears an advisory, and all of them are transitive: nothing here is a dependency
# this repository chose. Ranges are keyed by major where two majors are installed.
#
# `@hono/node-server` is the one major bump, and it is here because it was *tested*
# rather than reasoned about: it sits under the vendored Claude Agent SDK, whose HTTP
# MCP transports this codebase never imports (the capability registry uses `createSdkMcpServer`, in-process).
# The runner suite, an SDK import and a live sandboxed agent run all pass on 2.x.
#
# One advisory is deliberately left standing: **esbuild 0.18** (moderate, dev-server
# request forgery), pinned by `@esbuild-kit/*` inside drizzle-kit's migration CLI.
# drizzle-kit is already at its latest published version and still depends on it, so
# there is no upgrade path — and it is a devDependency that never runs in production or
# in a sandbox. Forcing esbuild forward would break the migration tooling to fix a
# vulnerability in a dev server this repository does not run. Revisit if drizzle-kit
# ever drops `@esbuild-kit`.
overrides:
 brace-expansion@^1: ^1.1.18
 brace-expansion@^5: ^5.0.9
 fast-uri@^3: ^3.1.5
 fast-uri@^4: ^4.1.2
 ip-address: ^10.3.1
 hono: ^4.12.34
 js-yaml@^4: ^4.3.1
 nanoid@^3: ^3.3.17
 "@hono/node-server": ^2.0.5
minimumReleaseAgeExclude:
 - '@turbo/darwin-64@2.10.7'
 - '@turbo/darwin-arm64@2.10.7'
 - '@turbo/linux-64@2.10.7'
 - '@turbo/linux-arm64@2.10.7'
 - '@turbo/windows-64@2.10.7'
 - '@turbo/windows-arm64@2.10.7'
 - turbo@2.10.7
 - '@orpc/client@1.14.10'
 - '@orpc/contract@1.14.10'
 - '@orpc/shared@1.14.10'
 - '@orpc/standard-server-fetch@1.14.10'
 - '@orpc/standard-server-peer@1.14.10'
 - '@orpc/standard-server@1.14.10'
 - '@orpc/interop@1.14.10'
 - '@orpc/server@1.14.10'
 - '@orpc/standard-server-aws-lambda@1.14.10'
 - '@orpc/standard-server-fastify@1.14.10'
 - '@orpc/standard-server-node@1.14.10'
